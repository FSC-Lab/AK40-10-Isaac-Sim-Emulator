ak_motor_cable_control_node:
  ros__parameters:
    # Isaac Sim side (ROS2CableWinchBackend topic prefix, cable_winch_backend_utils.py)
    isaac_winch_prefix: "cable_winch_0/"

    poll_rate_hz: 100.0

    # Torque(N.m)/force(N) scale factor for EXTERNAL mode and ~/joint_state synthesis only.
    # Defaults to the real AK40-10 winch's deployed drum_radius (config/cable_control_params.yaml
    # in AK40-10-ROS2-Bridge) so torque_limit_* keep the same calibrated real-world meaning.
    # NOT used by SPEED mode (see kp_speed/kd_speed below).
    effective_radius: 0.036   # m

    # SPEED-mode PD + feedforward. ~/command.velocity[0] is m/s directly here (emulator-specific
    # convention, NOT the real driver's raw-shaft rad/s — see src/ak_motor_cable_control_node.cpp
    # file header). gravity_feedforward_n cancels the constant gravity load directly (mirrors
    # cable_torque_ctrl_node's own tau_p=-m*g*r feedforward), so kp_speed/kd_speed only need to
    # provide gentle tracking dynamics, not disturbance rejection. An earlier attempt relying on
    # kp_speed alone to fight gravity (kp_speed=2000) was stiff enough to destabilize the physics
    # solver through the ROS2 + Isaac Sim control loop. Defaults below target ~4.2 rad/s,
    # near-critical damping, for this scenario's default masses (~5.54 N gravity load, ~0.565 kg
    # cable+payload mass, matching cable_torque_ctrl_node's deployed "mass" param) — retune all
    # three if those masses change.
    gravity_feedforward_n: 5.54   # N — (rod_b_mass+payload_mass)*g
    kp_speed: 10.0   # N/m
    kd_speed: 4.0    # N.s/m

    # Safety. Note: unlike the real driver, there is no separate kd_watchdog fallback gain — a
    # stale/missing command holds the current position via the same PD+feedforward law above
    # (freezing the setpoint) rather than falling back to weak damping, since this sim's
    # frictionless cable would otherwise let the payload free-fall under gravity.
    command_timeout_ms: 500.0
    heartbeat_timeout_ms: 1500.0

    # External mode torque clamp
    torque_limit_upper:  1.5    # N.m
    torque_limit_lower: -1.5    # N.m

    # EXTERNAL-mode shaft dynamics only (SPEED mode's PD+feedforward hold law is untouched by
    # this - see file header / compute_and_publish_force() in the .cpp). Some of ext_torque_cmd
    # goes into accelerating/damping the (fictitious - not present in Isaac Sim's own rigid-body
    # masses) motor shaft itself; only the remainder reaches the cable as force. Defaults match
    # cable_torque_ctrl_node's own deployed plant model exactly (AK40-10-ROS2-Bridge/config/
    # cable_torque_ctrl_params.yaml: ude_inertia, viscous_drag - note the deployed viscous_drag
    # there is 0.00038, not the .cpp fallback of 0.00140) so the simulated plant matches what
    # that controller was actually tuned/calibrated against. No static/Coulomb friction term -
    # viscous only, by design (cable_torque_ctrl_node's own coulomb_friction feedforward becomes
    # a harmless no-op against a plant that has none).
    shaft_inertia_kg_m2: 0.000995        # kg.m^2
    viscous_drag_nms_per_rad: 0.00038    # N.m.s/rad

    # EMA low-pass coefficient (0-1) applied to shaft speed before it's differentiated for the
    # inertia term above. 1.0 = unfiltered/raw. Computing the derivative against this node's
    # fixed poll period (instead of the actual measured time between real Isaac Sim samples)
    # caused sim divergence the moment EXTERNAL RUNNING engaged on first test (2026-07-11) -
    # fixed by moving the derivative into on_state_cable() using real elapsed time; this filter
    # is a second, complementary layer against plain sample-to-sample noise.
    omega_filter_alpha: 0.2
